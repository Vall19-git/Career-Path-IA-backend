$kind: collection
description: Colección de pruebas de la API REST de CareerPath AI
variables:
  baseUrl: http://localhost:3000
scripts:
  - type: http:afterResponse
    code: |-
      const esperado = pm.request.method === 'POST' ? 201 : 200;
      pm.test('Estado HTTP esperado', function () {
        pm.response.to.have.status(esperado);
      });
    language: text/javascript